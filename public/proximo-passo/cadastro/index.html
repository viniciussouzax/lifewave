<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" /><title>Abrindo o cadastro</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" />
<style>
/* O visual do /proximo-passo (fundo animado, logo, cartão e o badge de quem trouxe): a passagem é a continuação da página. */
@font-face{font-family:"Geist Variable";font-style:normal;font-weight:100 900;font-display:swap;src:url("/webinar-app/assets/geist-latin-wght-normal-BgDaEnEv.woff2") format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Geist Variable";font-style:normal;font-weight:100 900;font-display:swap;src:url("/webinar-app/assets/geist-latin-ext-wght-normal-DC-KSUi6.woff2") format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#faf8f4;--surface:#fff;--soft:#eef5fb;--ink:#0b2a5c;--text:oklch(.25 .06 258);--muted:oklch(.45 .04 258);
  --line:oklch(.89 .03 245);--field:oklch(.89 .03 245);--primary:#0b2a5c;--primary-d:#071d41;--err:#a8231b;--ok:#146c43;
  --display:"Jost","Geist Variable",system-ui,sans-serif;--body:"Geist Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:#1a73eb;color:var(--text);font:400 1rem/1.5 var(--body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
#prism{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#1a73eb}
#prism::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 28% 42%,rgba(236,246,255,.82) 0%,rgba(236,246,255,.5) 45%,rgba(236,246,255,0) 75%)}
header{position:relative;z-index:1}
.head{max-width:1280px;margin:0 auto;padding:24px 24px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{display:block;width:50%;max-width:200px;flex:none}
.logo span{position:relative;display:block}
.logo img{display:block;width:100%;height:auto;opacity:0}
.logo i{position:absolute;inset:0;background:#0b2a5c;-webkit-mask:url(/proximo-passo/logo-brandpartner.png) center/contain no-repeat;mask:url(/proximo-passo/logo-brandpartner.png) center/contain no-repeat}
@media (min-width:640px){.head{padding:32px 40px 0}}
@media (min-width:768px){.logo{width:154px}}
@media (min-width:1024px){.head{max-width:1152px;padding:28.8px 43.2px 0}.logo{width:181px}}
@media (min-width:1024px){html{font-size:90%}}
main{position:relative;z-index:1;flex:1;width:100%;max-width:560px;margin:0 auto;padding:20px 16px 32px}
.card{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:.8px solid rgba(255,255,255,.6);border-radius:16px;padding:22px 20px 20px;box-shadow:0 30px 60px -30px rgba(8,40,100,.55)}
@media (min-width:640px){.card{padding:28.8px}}
.indicacao{margin:16px auto 0;max-width:34rem;text-align:center;min-height:1.75rem}
.indicacao .badge{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(11,42,92,.12);color:var(--ink);font-size:.8125rem;overflow-wrap:anywhere}
.indicacao .badge strong{font-weight:500}
.indicacao .cod{color:var(--muted);font-variant-numeric:tabular-nums}
.indicacao .cod::before{content:"·";margin-right:8px;color:var(--muted)}
.espera{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:12px 0 4px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--primary);animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.msg{margin:0;font:300 1.375rem/1.25 var(--display);color:var(--ink)}
.espera a{font-size:.8125rem;color:var(--muted);text-underline-offset:3px}
</style></head>
<body>
<div class="page">
<div id="prism" aria-hidden="true"></div>
<header>
  <div class="head">
    <a class="logo" href="/" aria-label="LifeWave Brand Partner"><span><img src="/proximo-passo/logo-brandpartner.png" alt="LifeWave Brand Partner" width="877" height="312" /><i aria-hidden="true"></i></span></a>
  </div>
</header>
<main>
  <div class="card">
    <div class="espera" role="status" aria-live="polite">
      <div class="spin" aria-hidden="true"></div>
      <p class="msg">Abrindo a LifeWave…</p>
      <a id="seguir" href="https://lifewave.com/wellnesspatchesoficial">Se não abrir, toque aqui</a>
    </div>
  </div>
  <p class="indicacao" id="indicacao"></p>
</main>
</div>
<!--
  Passagem do "Abrir link de cadastro" do /proximo-passo. É a PÁGINA DE CONFIRMAÇÃO do rastreio de vendas do
  EverWebinar (Goal tracking): o script lê o cookie que o /proximo-passo gravou (wj_user, o inscrito) e avisa o
  EverWebinar, que marca purchased_live/purchased_replay = Yes. Aqui "comprou" quer dizer "clicou na oferta e abriu
  o link da LifeWave"; o preço 1.00 só conta quantos chegaram. Uma página só pode ter um código de rastreio.
-->
<script src="https://event.webinarjam.com/t/sale/13qvo4byip/v2?price=1.00&currency=USD"></script>
<script>
var q=new URLSearchParams(location.search);
/* Só segue para a LifeWave: um "para" de outro site faria desta página um redirecionador aberto. */
var destino="https://lifewave.com/wellnesspatchesoficial";
try{var u=new URL(q.get("para")||"");if(u.protocol==="https:"&&/^(www\.)?lifewave\.com$/.test(u.hostname))destino=u.href;}catch(e){}
document.getElementById("seguir").href=destino;
/* O badge de quem trouxe, como no /proximo-passo: o nome é o do link da LifeWave que vai abrir e o código vem do clique. */
try{
  var nome=decodeURIComponent(new URL(destino).pathname.split("/")[1]||""),cod=(q.get("ref")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
  if(nome){var b=document.createElement("span");b.className="badge";var n=document.createElement("strong");n.textContent=nome;b.appendChild(n);
    if(cod){var c=document.createElement("span");c.className="cod";c.textContent=cod;b.appendChild(c);}
    document.getElementById("indicacao").appendChild(b);}
}catch(e){}
/* O clique também vai ao postmaster (quem foi direto para o link não preenche nada). keepalive: termina mesmo com a saída. */
try{
  fetch("/api/proximo-passo/registro",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json"},
    body:JSON.stringify({objetivo:q.get("objetivo")||"",sub:q.get("sub")||"",continente:q.get("continente")||"",pais:q.get("pais")||"",codigo:q.get("ref")||"",pid:q.get("pid")||""})}).catch(function(){});
}catch(e){}
/* O aviso ao EverWebinar é assíncrono: espera um pouco para ele sair. */
setTimeout(function(){location.replace(destino);},1200);
</script>
<script src="/proximo-passo/prism.js"></script>
</body></html>
