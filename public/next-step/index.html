<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>Próximo passo | LifeWave Independent Brand Partner</title>
<style>
/* Fontes e cores do brandpartner.team (src/styles/global.css): Lora nos títulos, Geist no resto; azul #194F90, azul claro #5EB3E4. */
@font-face{font-family:"Geist";font-style:normal;font-weight:100 900;font-display:swap;src:url("/fonts/geist-var.woff2") format("woff2")}
@font-face{font-family:"Lora";font-style:normal;font-weight:400 700;font-display:swap;src:url("/fonts/lora-var.woff2") format("woff2")}
:root{
  --bg:#faf8f4;--surface:#fffefb;--soft:#ecf5fa;--ink:#194f90;--text:#373f41;--muted:#5a6870;
  --line:#5eb3e4;--field:#63717a;--primary:#194f90;--primary-d:#0d2137;--err:#a8231b;--ok:#146c43;
  --display:"Lora",Georgia,serif;--body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif
}
*{box-sizing:border-box}
html{text-size-adjust:100%}
body{margin:0;background:#1a73eb;color:var(--text);font:400 1rem/1.5 var(--body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.test{background:var(--primary);color:#fff;text-align:center;font-size:.8125rem;line-height:1.4;padding:8px 12px;border-radius:10px;margin:0 0 12px}
/* Fundo e logo iguais aos da homepage (webinar-app): campo animado fixo (prism.js) + luz suave; logo em #0b2a5c por mascara. */
#prism{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#1a73eb}
#prism::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 28% 42%,rgba(236,246,255,.82) 0%,rgba(236,246,255,.5) 45%,rgba(236,246,255,0) 75%)}
header{position:relative;z-index:1}
.head{max-width:1280px;margin:0 auto;padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:block;width:50%;max-width:200px;flex:none}
.logo span{position:relative;display:block}
.logo img{display:block;width:100%;height:auto;opacity:0}
.logo i{position:absolute;inset:0;background:#0b2a5c;-webkit-mask:url(/next-step/logo-brandpartner.png) center/contain no-repeat;mask:url(/next-step/logo-brandpartner.png) center/contain no-repeat}
.indep{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.6875rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.3}
@media (min-width:640px){.head{padding:32px 40px 0}}
@media (min-width:768px){.logo{width:154px}}
@media (min-width:1024px){.head{max-width:1152px;padding:28.8px 43.2px 0}.logo{width:181px}}
main{position:relative;z-index:1;flex:1;width:100%;max-width:560px;margin:0 auto;padding:20px 16px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px;box-shadow:0 1px 2px rgba(13,33,55,.05),0 8px 24px rgba(25,79,144,.08)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.bar{display:flex;gap:6px;margin-bottom:22px}
.bar i{flex:1;height:5px;border-radius:99px;background:var(--soft);box-shadow:inset 0 0 0 1px #c9e1f1}
.bar i.on{background:var(--primary);box-shadow:none}
.view{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:400 1.625rem/1.2 var(--display);letter-spacing:-.02em;color:var(--ink);margin:0 0 6px}
h1:focus{outline:none}
.sub{color:var(--text);margin:0 0 18px;font-size:.9375rem}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font:inherit;letter-spacing:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:56px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:var(--primary);background:var(--soft)}
.opt:active{background:#dcecf6}
.opt strong{display:block;color:var(--ink);font-weight:600;font-size:1rem}
.opt span.d{display:block;color:var(--muted);font-size:.875rem;margin-top:2px}
.opt svg{flex:none;width:20px;height:20px;color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:inherit;font-weight:500;padding:10px 4px;margin-top:12px;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.back svg{width:16px;height:16px}
label{display:block;font-weight:600;color:var(--ink);font-size:.9375rem;margin:14px 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;letter-spacing:inherit;color:var(--text);padding:12px 14px;border:1.5px solid var(--field);border-radius:10px;background:#fff;min-height:48px}
input[aria-invalid=true]{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.err{color:var(--err);font-size:.875rem;font-weight:500;margin:6px 0 0}
.err:empty{margin:0}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:400;color:var(--text);font-size:.875rem;margin-top:18px}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--primary)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font:inherit;font-weight:600;letter-spacing:inherit;background:var(--primary);color:#fff;border:0;border-radius:10px;padding:14px 20px;min-height:52px;cursor:pointer;text-decoration:none;width:100%;margin-top:20px;transition:background .15s}
.cta:hover{background:var(--primary-d)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
ol.steps li:last-child{margin-bottom:0}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:.8125rem;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.box{background:var(--soft);border-radius:12px;padding:16px;margin-top:4px}
.ref{margin:14px 0 0;font-size:.8125rem;color:var(--muted);text-align:center}
.done{text-align:center;padding:8px 0 4px}
.done .ico{width:56px;height:56px;border-radius:50%;background:#e3f3ea;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done .ico svg{width:30px;height:30px}
.done p{margin:0 0 8px}
footer{position:relative;z-index:1;font-size:.75rem;line-height:1.5;color:var(--muted);text-align:center;padding:18px 16px 24px;border-top:1px solid var(--line);background:var(--surface)}
footer b{color:var(--ink)}
@media (min-width:600px){.card{padding:28px 28px 24px}h1{font-size:1.875rem}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
<div id="prism" aria-hidden="true"></div>
<header>
  <div class="head">
    <a class="logo" href="/" aria-label="LifeWave Brand Partner"><span><img src="/next-step/logo-brandpartner.png" alt="LifeWave Brand Partner" width="877" height="312" /><i aria-hidden="true"></i></span></a>
    <p class="indep">LifeWave Independent<br />Brand Partner</p>
  </div>
</header>
<main>
  <div class="test" role="note">VERSÃO DE TESTE. Links de saída são provisórios e nenhum dado é enviado a serviço externo.</div>
  <div class="card">
    <p class="meta"><span id="stepLabel">Etapa 1 de 3</span></p>
    <div class="bar" id="prog" role="progressbar" aria-label="Progresso" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-valuetext="Etapa 1 de 3"></div>
    <div id="view" class="view"></div>
    <noscript><p>Este formulário precisa de JavaScript para funcionar.</p></noscript>
  </div>
</main>
<footer>
  <b>LifeWave Independent Brand Partner.</b> Este conteúdo é de um Brand Partner independente e não é da LifeWave Ltd. Resultados variam de pessoa para pessoa.
</footer>
</div>
<script>
/* Textos por idioma. shortcut: só pt preenchido; en e es entram aqui com as mesmas chaves quando houver tradução aprovada. */
var I18N = {
  pt: {
    step:"Etapa", of:"de",
    r_q:"Onde você mora?", r_s:"Assim levamos você ao caminho certo.",
    regions:{na:"América do Norte",eu:"Europa",as:"Ásia",la:"América Latina",af:"África"},
    g_q:"O que você quer?", g_s:"Escolha uma opção.",
    goals:{bp:["Ser Brand Partner","Cadastro na empresa com passo a passo."],
           sub:["Ser consumidor com assinatura","Cadastro como cliente com compra recorrente."],
           once:["Comprar uma vez","Compra avulsa na loja, sem assinatura."]},
    s_q:"Como você prefere começar?", s_s:"Duas formas de criar o cadastro de consumidor.",
    subs:{"2.2":["Cadastro com 3 envelopes de X39","Você compra 3 envelopes de X39 e ativa a assinatura de X39 ou de outro produto."],
          "2.3":["Cadastro com taxa de adesão","Você paga a taxa de cadastro, compra 1 envelope de X39 e ativa a assinatura de X39."]},
    back:"Voltar", open:"Abrir link de cadastro (TESTE)",
    res_t:"Seu próximo passo", res_s:"Siga o passo a passo e use o link abaixo.",
    ref_l:"Indicado por", ref_none:"sem indicador (link padrão)",
    steps:{
      bp:["Abra o link abaixo.","Escolha a opção de cadastro como Brand Partner.","Preencha seus dados e confirme o e-mail.","Fale com quem indicou você para os primeiros passos."],
      "2.2":["Abra o link abaixo.","Crie o cadastro de consumidor.","Adicione 3 envelopes de X39 ao pedido.","Ative a assinatura de X39 ou de outro produto e finalize."],
      "2.3":["Abra o link abaixo.","Crie o cadastro de consumidor e pague a taxa de adesão.","Compre 1 envelope de X39.","Ative a assinatura de X39 e finalize."],
      once:["Abra o link abaixo para a loja.","Escolha o envelope de X39.","Finalize a compra sem assinatura."]},
    c_t:"Quase lá. Deixe seu contato", c_s:"Um Brand Partner vai falar com você para fazer o cadastro e a entrega.",
    name:"Nome",email:"E-mail",phone:"Telefone com DDD",
    consent:"Concordo em ser contatado por um Brand Partner independente da LifeWave por telefone, WhatsApp ou e-mail para tratar do meu cadastro. Posso pedir para parar a qualquer momento.",
    send:"Enviar contato",
    e_name:"Informe seu nome.",e_email:"Informe um e-mail válido.",e_phone:"Informe um telefone válido (8 a 15 dígitos).",e_consent:"Marque a caixa para continuar.",
    e_save:"Não foi possível salvar neste navegador.",
    done_t:"Recebemos seu contato", done_s:"Um Brand Partner entrará em contato com você para fazer o cadastro e combinar a entrega.",
    done_save:"Em modo de teste, o contato ficou salvo só neste navegador."
  }
};
var qs=new URLSearchParams(location.search);
var LANG=I18N[qs.get("lang")]?qs.get("lang"):"pt";
var T=I18N[LANG];
document.documentElement.lang={pt:"pt-BR",en:"en",es:"es"}[LANG]||"pt-BR";
/* Indicador: só letras, números, _ e - */
var REF=(qs.get("ref")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
/* Links de saída de TESTE. shortcut: um destino de teste para todas as regiões; trocar pelos links rastreáveis reais (nunca a URL direta da loja) quando o master enviar a tabela. */
var DEST_BASE="/next-step/destino-teste/";
function buildLink(region,goal){
  var p=new URLSearchParams({regiao:region,objetivo:goal,ref:REF||"padrao"});
  return DEST_BASE+"?"+p.toString();
}
var STORE="bp_leads_teste";
var S={region:null,goal:null,sub:null};
var view=document.getElementById("view"),prog=document.getElementById("prog"),stepLabel=document.getElementById("stepLabel");
var SVGNS="http://www.w3.org/2000/svg";
function icon(path){
  var s=document.createElementNS(SVGNS,"svg");
  s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-width","2");s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");s.setAttribute("aria-hidden","true");
  var p=document.createElementNS(SVGNS,"path");p.setAttribute("d",path);s.appendChild(p);return s;
}
var CHEVRON="M9 6l6 6-6 6", ARROW_L="M15 6l-6 6 6 6", CHECK="M5 12.5l4.5 4.5L19 7.5";
function el(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){e.appendChild(c)});return e;}
/* Indicador de etapa: cur de total (total passa de 3 para 4 quando o caminho tem a escolha 2.2/2.3). */
function setStep(cur,tot){
  var txt=T.step+" "+cur+" "+T.of+" "+tot;
  stepLabel.textContent=txt;
  prog.setAttribute("aria-valuemax",tot);prog.setAttribute("aria-valuenow",cur);prog.setAttribute("aria-valuetext",txt);
  prog.textContent="";
  for(var i=1;i<=tot;i++)prog.appendChild(el("i",i<=cur?{"class":"on"}:{}));
}
function render(node,cur,tot,back){
  setStep(cur,tot);
  view.textContent="";view.appendChild(node);
  if(back){var b=el("button",{type:"button","class":"back"},[icon(ARROW_L),document.createTextNode(T.back)]);b.onclick=back;view.appendChild(b);}
  view.style.animation="none";void view.offsetWidth;view.style.animation="";
  var h=view.querySelector("h1");if(h){h.setAttribute("tabindex","-1");h.focus();}
}
function options(list,onPick){
  var ul=el("ul",{"class":"opts"});
  list.forEach(function(o){
    var txt=el("span",{},[el("strong",{text:o.t})].concat(o.d?[el("span",{"class":"d",text:o.d})]:[]));
    var b=el("button",{type:"button","class":"opt","data-v":o.v},[txt,icon(CHEVRON)]);
    b.onclick=function(){onPick(o.v)};ul.appendChild(el("li",{},[b]));
  });return ul;
}
function total(){return S.goal==="sub"?4:3;}
function stepRegion(){
  S={region:null,goal:null,sub:null};
  var n=el("div",{},[el("h1",{text:T.r_q}),el("p",{"class":"sub",text:T.r_s}),
    options(Object.keys(T.regions).map(function(k){return{v:k,t:T.regions[k]}}),function(v){S.region=v;stepGoal();})]);
  render(n,1,3);
}
function stepGoal(){
  var n=el("div",{},[el("h1",{text:T.g_q}),el("p",{"class":"sub",text:T.g_s}),
    options(Object.keys(T.goals).map(function(k){return{v:k,t:T.goals[k][0],d:T.goals[k][1]}}),function(v){
      S.goal=v;S.sub=null;
      if(v==="sub")stepSub();else next();
    })]);
  render(n,2,3,stepRegion);
}
function stepSub(){
  var n=el("div",{},[el("h1",{text:T.s_q}),el("p",{"class":"sub",text:T.s_s}),
    options(Object.keys(T.subs).map(function(k){return{v:k,t:T.subs[k][0],d:T.subs[k][1]}}),function(v){S.sub=v;next();})]);
  render(n,3,4,stepGoal);
}
function backFromEnd(){ if(S.goal==="sub")stepSub(); else stepGoal(); }
function next(){ if(S.region==="la")stepContact(); else stepResult(); }
function stepResult(){
  var key=S.goal==="sub"?S.sub:S.goal;
  var ol=el("ol",{"class":"steps"},T.steps[key].map(function(t){return el("li",{},[el("span",{text:t})])}));
  var a=el("a",{"class":"cta",id:"out",href:buildLink(S.region,key),rel:"noopener",text:T.open});
  var ref=el("p",{"class":"ref",text:T.ref_l+": "+(REF||T.ref_none)});
  render(el("div",{},[el("h1",{text:T.res_t}),el("p",{"class":"sub",text:T.res_s}),el("div",{"class":"box"},[ol]),a,ref]),total(),total(),backFromEnd);
}
function field(id,label,type,auto){
  var attrs={id:id,name:id,type:type,autocomplete:auto,"aria-describedby":id+"-e"};
  if(type==="tel")attrs.inputmode="tel";
  return [el("label",{"for":id,text:label}),el("input",attrs),el("p",{"class":"err",id:id+"-e",role:"alert"})];
}
function stepContact(){
  var f=el("form",{novalidate:"novalidate"});
  field("name",T.name,"text","name").concat(field("email",T.email,"email","email"),field("phone",T.phone,"tel","tel")).forEach(function(x){f.appendChild(x)});
  var cb=el("input",{type:"checkbox",id:"consent","aria-describedby":"consent-e"});
  f.appendChild(el("label",{"class":"chk","for":"consent"},[cb,el("span",{text:T.consent})]));
  f.appendChild(el("p",{"class":"err",id:"consent-e",role:"alert"}));
  f.appendChild(el("button",{type:"submit","class":"cta",text:T.send}));
  f.onsubmit=function(ev){ev.preventDefault();submitContact(f)};
  render(el("div",{},[el("h1",{text:T.c_t}),el("p",{"class":"sub",text:T.c_s}),f]),total(),total(),backFromEnd);
}
function submitContact(f){
  var v={name:f.elements.name.value.trim(),email:f.elements.email.value.trim(),phone:f.elements.phone.value.trim()};
  var digits=v.phone.replace(/\D/g,"");
  var errs={name:v.name.length<2?T.e_name:"",email:/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email)?"":T.e_email,
    phone:(digits.length<8||digits.length>15)?T.e_phone:"",consent:document.getElementById("consent").checked?"":T.e_consent};
  var first=null;
  ["name","email","phone","consent"].forEach(function(k){
    document.getElementById(k+"-e").textContent=errs[k];
    var i=document.getElementById(k);i.setAttribute("aria-invalid",errs[k]?"true":"false");
    if(errs[k]&&!first)first=i;
  });
  if(first){first.focus();return;}
  var rec={name:v.name,email:v.email,phone:digits,consent:true,consentText:T.consent,region:S.region,goal:S.goal,sub:S.sub,ref:REF||null,at:new Date().toISOString()};
  /* shortcut: contato só no localStorage do navegador (teste); trocar por armazenamento no servidor, com política de privacidade e retenção, antes de produção. */
  try{var all=JSON.parse(localStorage.getItem(STORE)||"[]");all.push(rec);localStorage.setItem(STORE,JSON.stringify(all));}
  catch(e){document.getElementById("consent-e").textContent=T.e_save;return;}
  render(el("div",{"class":"done"},[el("div",{"class":"ico"},[icon(CHECK)]),el("h1",{text:T.done_t}),el("p",{id:"done",text:T.done_s}),el("p",{"class":"ref",text:T.done_save})]),total(),total());
}
stepRegion();
</script>
<script src="/next-step/prism.js"></script>
</body>
</html>
