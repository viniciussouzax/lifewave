  for(var i=1;i<=tot;i++)prog.appendChild(el("i",i<=cur?{"class":"on"}:{}));
}
function render(node,cur,tot,back){
  setStep(cur,tot);
  view.textContent="";view.appendChild(node);
  if(back){var b=el("button",{type:"button","class":"back"},[icon(ARROW_L),document.createTextNode(T.back)]);b.onclick=back;view.appendChild(b);}
  view.style.animation="none";void view.offsetWidth;view.style.animation="";
  var h=view.querySelector("h1");if(h){h.setAttribute("tabindex","-1");h.focus();}
}
function options(list,onPick){
  var ul=el("ul",{"class":"opts"});
  list.forEach(function(o){
    var txt=el("span",{},[el("strong",{text:o.t})].concat(o.d?[el("span",{"class":"d",text:o.d})]:[]));
    /* Bandeira (o.flag) ou ícone (o.ico) à esquerda do texto; o nome do país continua sendo o rótulo do botão. */
    if(o.flag)txt=el("span",{"class":"lead"},[el("img",{"class":"flag",src:o.flag,alt:"",width:"30",height:"20",loading:"lazy"}),txt]);
    else if(o.ico)txt=el("span",{"class":"lead"},[icon(o.ico),txt]);
    else if(o.map)txt=el("span",{"class":"lead"},[mapa(o.map),txt]);
    var b=el("button",{type:"button","class":"opt","data-v":o.v},[txt,icon(CHEVRON)]);
    b.onclick=function(){onPick(o.v)};ul.appendChild(el("li",{},[b]));
  });return ul;
}
function total(){return S.goal==="sub"?5:4;}
function stepRegion(){
  S={region:null,pais:null,entrega:false,goal:null,sub:null};
  var n=el("div",{},[el("h1",{text:T.r_q}),el("p",{"class":"sub",text:T.r_s}),
    options(Object.keys(T.regions).map(function(k){return{v:k,t:T.regions[k],map:k}}),function(v){S.region=v;stepCountry();})]);
  render(n,1,4);
}
function stepCountry(){
  var lista=(CFG.paises[S.region]||[]).map(function(x){return{v:x[0],t:x[1],flag:"/next-step/flags/"+x[0]+".svg"}}).concat([{v:"ZZ",t:T.p_outro,ico:GLOBE}]);
  var n=el("div",{},[el("h1",{text:T.p_q}),el("p",{"class":"sub",text:T.p_s}),
    options(lista,function(v){
      S.pais=v;var a=(CFG.paises[S.region]||[]).filter(function(x){return x[0]===v})[0];S.entrega=!!(a&&a[2]);stepGoal();
    })]);
  render(n,2,4,stepRegion);
}
function stepGoal(){
  var n=el("div",{},[el("h1",{text:T.g_q}),el("p",{"class":"sub",text:T.g_s}),
    options(Object.keys(T.goals).map(function(k){return{v:k,t:T.goals[k][0],d:T.goals[k][1]}}),function(v){
      S.goal=v;S.sub=null;
      if(v==="sub")stepSub();else next();
    })]);
  render(n,3,total(),stepCountry);
}
function stepSub(){
  var n=el("div",{},[el("h1",{text:T.s_q}),el("p",{"class":"sub",text:T.s_s}),
    options(Object.keys(T.subs).map(function(k){return{v:k,t:T.subs[k][0],d:T.subs[k][1]}}),function(v){S.sub=v;next();})]);
  render(n,4,5,stepGoal);
}
function backFromEnd(){ if(S.goal==="sub")stepSub(); else stepGoal(); }
function next(){ if(S.entrega)stepResult(); else stepContact(); }
function stepResult(){
  var key=S.goal==="sub"?S.sub:S.goal;
  var ol=el("ol",{"class":"steps"},T.steps[key].map(function(t){return el("li",{},[el("span",{text:t})])}));
  var a=el("a",{"class":"cta",id:"out",href:buildLink(S.goal),rel:"noopener",text:S.goal==="once"?T.open_once:T.open});
  var ref=el("p",{"class":"ref",text:T.ref_l+": "+(REF||T.ref_none)});
  render(el("div",{},[el("h1",{text:T.res_t}),el("p",{"class":"sub",text:T.res_s}),el("div",{"class":"box"},[ol]),a,ref]),total(),total(),backFromEnd);
}
function field(id,label,type,auto){
  var attrs={id:id,name:id,type:type,autocomplete:auto,"aria-describedby":id+"-e"};
  if(type==="tel")attrs.inputmode="tel";
  return [el("label",{"for":id,text:label}),el("input",attrs),el("p",{"class":"err",id:id+"-e",role:"alert"})];
}
/* Os dados que a pessoa digitou na inscrição do webinar, NESTE navegador (bp_contato): o formulário já vem preenchido.
   Nunca buscados no servidor por um id da URL: um link encaminhado mostraria os dados de outra pessoa. */
function contatoGuardado(){try{return JSON.parse(localStorage.getItem("bp_contato")||"null")||{};}catch(e){return {};}}
function stepContact(){
  var g=contatoGuardado(),enc=S.goal==="once";
  var f=el("form",{novalidate:"novalidate"});
  f.appendChild(el("p",{"class":"ref",text:T.place+": "+nomeDoPais()+" ("+T.regions[S.region]+")"}));
  field("name",T.name,"text","name").concat(field("email",T.email,"email","email"),field("phone",T.phone,"tel","tel")).forEach(function(x){f.appendChild(x)});
  if(enc){
    f.appendChild(el("label",{"for":"addr",text:T.addr}));
    f.appendChild(el("textarea",{id:"addr",name:"addr",rows:"3",autocomplete:"street-address","aria-describedby":"addr-e"}));
    f.appendChild(el("p",{"class":"err",id:"addr-e",role:"alert"}));
    field("qty",T.qty,"number","off").forEach(function(x){f.appendChild(x)});
  }
  var cb=el("input",{type:"checkbox",id:"consent","aria-describedby":"consent-e"});
  f.appendChild(el("label",{"class":"chk","for":"consent"},[cb,el("span",{text:T.consent})]));
  f.appendChild(el("p",{"class":"err",id:"consent-e",role:"alert"}));
  /* Isca contra robô: fora da tela e do teclado; quem preenche é script. */
  f.appendChild(el("input",{type:"text",name:"site",tabindex:"-1",autocomplete:"off","aria-hidden":"true",style:"position:absolute;left:-9999px;width:1px;height:1px;opacity:0"}));
  f.appendChild(el("button",{type:"submit","class":"cta",text:enc?T.send_enc:T.send}));
  f.onsubmit=function(ev){ev.preventDefault();submitContact(f)};
  render(el("div",{},[el("h1",{text:enc?T.c_t_enc:T.c_t}),el("p",{"class":"sub",text:enc?T.c_s_enc:T.c_s_bp}),f]),total(),total(),backFromEnd);
  if(g.nome)f.elements.name.value=g.nome;
  if(g.email)f.elements.email.value=g.email;
  if(g.telefone)f.elements.phone.value=((g.ddi||"")+" "+g.telefone).trim();
  if(enc){var q=f.elements.qty;q.min="1";q.max="99";q.step="1";q.inputMode="numeric";}
}
function submitContact(f){
  var enc=S.goal==="once";
  var v={name:f.elements.name.value.trim(),email:f.elements.email.value.trim(),phone:f.elements.phone.value.trim(),
    addr:enc?f.elements.addr.value.trim():"",qty:enc?Number(f.elements.qty.value):0};
  var digits=v.phone.replace(/\D/g,"");
  var errs={name:v.name.length<2?T.e_name:"",email:/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email)?"":T.e_email,
    phone:(digits.length<8||digits.length>15)?T.e_phone:"",consent:document.getElementById("consent").checked?"":T.e_consent};
  var campos=["name","email","phone"];
  if(enc){errs.addr=v.addr.length<8?T.e_addr:"";errs.qty=(Number.isInteger(v.qty)&&v.qty>=1&&v.qty<=99)?"":T.e_qty;campos.push("addr","qty");}
  campos.push("consent");
  var first=null;
  campos.forEach(function(k){
    document.getElementById(k+"-e").textContent=errs[k];
    var i=document.getElementById(k);i.setAttribute("aria-invalid",errs[k]?"true":"false");
    if(errs[k]&&!first)first=i;
  });
  if(first){first.focus();return;}
  var btn=f.querySelector("button[type=submit]");
  if(btn.disabled)return;
  btn.disabled=true;
  var body={nome:v.name,email:v.email,telefone:digits,consentimento:true,regiao:S.region,pais:S.pais,objetivo:S.goal,sub:S.sub||"",
    endereco:v.addr,quantidade:enc?v.qty:0,site:f.elements.site.value,origem:{utm_source:REF}};
  /* O servidor entrega o contato ao postmaster (/api/next-step/lead); só mostra "recebemos" se ele confirmou. */
  fetch("/api/next-step/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error(r.status);})
    .then(function(){
      render(el("div",{"class":"done"},[el("div",{"class":"ico"},[icon(CHECK)]),el("h1",{text:enc?T.done_t_enc:T.done_t}),el("p",{id:"done",text:enc?T.done_s_enc:T.done_s})]),total(),total());
    })
    .catch(function(){btn.disabled=false;document.getElementById("consent-e").textContent=T.e_save;});
}
stepRegion();
</script>
